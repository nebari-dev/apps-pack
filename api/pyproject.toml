[project]
name = "nebari-apps-api"
dynamic = ["version"]
description = "REST API for the Nebari Apps Pack - CRUD + observability over App custom resources"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "kubernetes>=31.0",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "PyJWT[crypto]>=2.15",
    "httpx>=0.27",
    "structlog>=25.4",
    "prometheus-client>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<2.5",
    "pytest-cov>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The version lives in __init__.py (release-please bumps it), so uv.lock
# does not record it and a release needs no relock.
[tool.hatch.version]
path = "src/nebari_apps_api/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nebari_apps_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# CI runs pytest with --cov (measuring the source below); the floor sits a little under today's
# 87% so a change that drops coverage noticeably fails. Raise it as tests land.
[tool.coverage.run]
source = ["nebari_apps_api"]

[tool.coverage.report]
fail_under = 89
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
pydocstyle = { convention = "google" }
select = ["E", "F", "I001", "B", "C4", "ISC", "RET", "SIM", "PTH", "D2", "UP", "ASYNC", "RUF"]
ignore = [
    # Conflicts with the ruff formatter
    "ISC001",
    # Only strings can exceed the line length once the formatter has run
    "E501",
    # Docstrings wrap their opening sentence; in apps-mcp they are the tool
    # descriptions agents read, so they are not split into summary + body.
    "D205",
    # Mutually exclusive with D211 / D212
    "D203",
    "D213",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
