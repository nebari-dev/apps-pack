name: Docs
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
env:
  # Route slug on the portal; also the production Astro base path (/apps-pack/).
  PACK_SLUG: apps-pack
  CF_PROJECT: apps-pack
jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # preview-URL comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # lastUpdated needs full git history
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: docs/.bun-version
          # This job deploys; never restore a cache another run could have written.
          no-cache: true

      - name: Compute base path and deploy branch
        id: cf
        env:
          GH_REF: ${{ github.ref }}
          GH_HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ "$GH_REF" = "refs/heads/main" ]; then
            echo "base_path=/${PACK_SLUG}/" >> "$GITHUB_OUTPUT"
            echo "branch=main" >> "$GITHUB_OUTPUT"
          else
            # PR previews serve at the pages.dev alias root (no Worker), so build at root base.
            echo "base_path=/" >> "$GITHUB_OUTPUT"
            echo "branch=${GH_HEAD_REF}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        run: cd docs && bun install --frozen-lockfile

      - name: Test
        run: cd docs && bun test test

      # External links only: internal ones are checked against the build by the
      # tests above. Root-relative links resolve to a placeholder host that is
      # excluded, and so is this site's own deployment (a new page is not live
      # until this change merges); example and local-cluster hostnames are
      # illustrative.
      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          output: ${{ runner.temp }}/lychee.md
          args: >-
            --no-progress --max-retries 3 --accept 200,206,429
            --base-url https://internal.invalid/
            --exclude '^https://internal\.invalid/' --exclude '^file:'
            --exclude '^https://packs\.nebari\.dev/apps-pack/'
            --exclude 'example\.(ai|com)' --exclude '\.nebari\.(local|test)' --exclude 'localhost|127\.0\.0\.1'
            'docs/src/content/docs/*.md' README.md

      - name: Build
        # Dynamic base: subpath on main, root on PR previews (astro.config reads BASE_PATH).
        env:
          BASE_PATH: ${{ steps.cf.outputs.base_path }}
        run: cd docs && bun run build

      # Fork and Dependabot PRs cannot read secrets; skip deploy there (build above still gates).
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/dist --project-name=${{ env.CF_PROJECT }} --branch=${{ steps.cf.outputs.branch }}

      - name: Comment preview URL
        if: ${{ github.event_name == 'pull_request' && steps.deploy.outcome == 'success' }}
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          comment-tag: docs-preview
          message: |
            📄 **Docs preview** for `${{ github.event.pull_request.head.ref }}`:
            ${{ steps.deploy.outputs.pages-deployment-alias-url }}
