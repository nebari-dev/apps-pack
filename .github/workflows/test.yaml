name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR runs; every push to main still runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  operator:
    name: Operator unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: operator/go.mod

      - name: go test
        working-directory: operator
        run: go test ./... -race -count=1 -coverprofile="$RUNNER_TEMP/cover.out"

      # The floor is for internal/ (the reconciler): cmd/ is wiring covered by
      # envtest below, and api/ is mostly generated deepcopy code. It sits a
      # little under today's 87%; raise it as tests land.
      - name: Coverage floor
        working-directory: operator
        env:
          FLOOR: "85"
        run: |
          grep -E '^mode:|/internal/' "$RUNNER_TEMP/cover.out" > "$RUNNER_TEMP/internal.out"
          total=$(go tool cover -func="$RUNNER_TEMP/internal.out" | awk '/^total:/ { sub("%", "", $3); print $3 }')
          echo "internal/ coverage: ${total}% (floor ${FLOOR}%)"
          awk -v t="$total" -v f="$FLOOR" 'BEGIN { exit !(t >= f) }' || {
            echo "::error::operator internal/ coverage ${total}% is below the ${FLOOR}% floor"; exit 1; }

  envtest:
    name: Operator envtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: operator/go.mod

      # The reconciler against a real kube-apiserver and etcd (no kubelet or
      # controllers): CRD validation, generations and watches. setup-envtest is
      # pinned to a commit on controller-runtime's release-0.25 branch.
      - name: go test -tags envtest
        working-directory: operator
        env:
          ENVTEST_K8S_VERSION: "1.37.0"
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.3-0.20261012174806-32759fab3119
          KUBEBUILDER_ASSETS=$(setup-envtest use "$ENVTEST_K8S_VERSION" --bin-dir "$RUNNER_TEMP/envtest" -p path)
          export KUBEBUILDER_ASSETS
          go test -tags envtest ./internal/controller/ -race -count=1 -run Envtest -v

  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.11"
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Check the lockfile is current
        working-directory: api
        run: uv lock --check

      - name: Install from the lockfile and test
        working-directory: api
        run: |
          uv sync --frozen --extra dev
          uv run --frozen --no-sync python -m pytest -q --cov --cov-report=term

  mcp:
    name: MCP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.11"
          enable-cache: true
          cache-dependency-glob: mcp/uv.lock

      - name: Check the lockfile is current
        working-directory: mcp
        run: uv lock --check

      - name: Install from the lockfile and test
        working-directory: mcp
        # The tests drive the real apps-api in process. Its dependencies are
        # pinned by mcp/uv.lock (the dev extra), so the package itself goes
        # in without resolving anything.
        run: |
          uv sync --frozen --extra dev
          uv pip install --no-deps -e ../api
          uv run --frozen --no-sync python -m pytest -q --cov --cov-report=term

  ui:
    name: UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install and build
        working-directory: ui
        run: |
          npm ci
          npm run build

      # Budgets are in ui/package.json "bundleBudget".
      - name: Bundle size budget
        working-directory: ui
        run: npm run size

      # Thresholds are in ui/vite.config.ts (test.coverage).
      - name: Unit tests with coverage
        working-directory: ui
        run: npm run test:coverage

  ui-headers:
    name: UI image headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Boots the real image so the assertion covers nginx's header
      # inheritance, not just the config text.
      - name: Build and check security headers
        run: |
          docker build -t apps-ui:headers ui
          ui/scripts/check-headers.sh apps-ui:headers
