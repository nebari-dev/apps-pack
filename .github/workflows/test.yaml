name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  operator:
    name: Operator unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod

      - name: go test
        working-directory: operator
        run: go test ./... -race -count=1

  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.10.11"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Check the lockfile is current
        working-directory: api
        run: uv lock --check

      - name: Install from the lockfile and test
        working-directory: api
        run: |
          uv sync --frozen --extra dev
          uv run --frozen --no-sync python -m pytest -q

  mcp:
    name: MCP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.10.11"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: mcp/uv.lock

      - name: Check the lockfile is current
        working-directory: mcp
        run: uv lock --check

      - name: Install from the lockfile and test
        working-directory: mcp
        # The tests drive the real apps-api in process. Its dependencies are
        # pinned by mcp/uv.lock (the dev extra), so the package itself goes
        # in without resolving anything.
        run: |
          uv sync --frozen --extra dev
          uv pip install --no-deps -e ../api
          uv run --frozen --no-sync python -m pytest -q

  ui:
    name: UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install and build
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Unit tests
        working-directory: ui
        run: npm test
