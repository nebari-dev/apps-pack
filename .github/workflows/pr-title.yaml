name: PR title

# Pull requests are squash-merged, so the title becomes the commit subject on
# main. Require a Conventional Commit subject (feat:, fix(api):, ...).

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      # Reads only the PR title through the API; no code from the PR is checked out.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            ci
            build
            refactor
            perf
            test
            revert
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" starts with an uppercase letter. Start it lowercase,
            e.g. "fix(api): reject empty subdomains".
