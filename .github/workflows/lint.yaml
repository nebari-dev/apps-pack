name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR runs; every push to main still runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: helm lint
        run: helm lint charts/nebari-apps --set clusterDomain=nebari.example.com

      - name: helm template
        run: |
          helm template test charts/nebari-apps \
            --set clusterDomain=nebari.example.com \
            --set keycloak.url=https://keycloak.nebari.example.com/auth > /tmp/rendered.yaml
          echo "Rendered $(grep -c '^kind:' /tmp/rendered.yaml) resources"

      - name: helm template (examples/nebari-values.yaml)
        run: helm template test charts/nebari-apps -f examples/nebari-values.yaml > /dev/null

      # values.schema.json is enforced by every helm lint/template above; this
      # proves it rejects what it should (typo'd keys, bad enums and types).
      - name: values.schema.json rejects bad values
        run: |
          set -u
          for bad in api.replicaCont=2 gateway=privat tls.enabled=yes \
              ui.branding.banners.top.txt=CUI 'operator.extraEnv[0].value=x' keycloak.url=keycloak.example.ai; do
            if helm template test charts/nebari-apps -f examples/nebari-values.yaml --set "$bad" > /dev/null 2>&1; then
              echo "::error::values.schema.json accepted --set $bad"; exit 1
            fi
          done
          echo "schema rejected every bad value"

      - name: Chart README is generated from values.yaml (helm-docs)
        run: |
          docker run --rm -v "$PWD:/helm-docs" -u "$(id -u)" \
            jnorwood/helm-docs@sha256:7e562b49ab6b1dbc50c3da8f2dd6ffa8a5c6bba327b1c6335cc15ce29267979c \
            --chart-search-root charts
          git diff --exit-code -- charts/nebari-apps/README.md || {
            echo "::error::charts/nebari-apps/README.md is stale; regenerate it with helm-docs (see CONTRIBUTING.md)"; exit 1; }

      - name: API RBAC is namespaced when allowedNamespaces is set
        run: |
          pip install pyyaml==6.0.3
          helm template test charts/nebari-apps \
            --set clusterDomain=nebari.example.com \
            --set keycloak.url=https://keycloak.nebari.example.com/auth \
            --set 'api.allowedNamespaces={apps,team-a}' > /tmp/scoped.yaml
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open("/tmp/scoped.yaml")) if d]
          crbs = [d for d in docs if d["kind"] == "ClusterRoleBinding" and d["roleRef"]["name"] == "test-nebari-apps-api"]
          assert not crbs, "API App/pod access must not be bound cluster-wide when allowedNamespaces is set"
          rbs = sorted(d["metadata"]["namespace"] for d in docs if d["kind"] == "RoleBinding" and d["roleRef"]["name"] == "test-nebari-apps-api")
          assert rbs == ["apps", "team-a"], rbs
          cluster = next(d for d in docs if d["kind"] == "ClusterRole" and d["metadata"]["name"] == "test-nebari-apps-api-cluster")
          assert {r["resources"][0] for r in cluster["rules"]} == {"namespaces", "pods"}, cluster["rules"]
          assert all(set(r["verbs"]) <= {"get", "list"} for r in cluster["rules"]), cluster["rules"]
          print("API RBAC scoped to", rbs)
          PY

      # Renders the PrometheusRule, then has promtool check the PromQL and run
      # the alert unit tests in .github/prometheus/ against it.
      - name: Alert rules (promtool)
        run: |
          helm template t charts/nebari-apps -n nebari-apps -f examples/nebari-values.yaml \
            --set telemetry.enabled=true --set telemetry.prometheusRule.enabled=true > "$RUNNER_TEMP/mon.yaml"
          python3 - "$RUNNER_TEMP/mon.yaml" .github/prometheus/rules.yaml <<'PY'
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d]
          rule = next(d for d in docs if d["kind"] == "PrometheusRule")
          yaml.safe_dump({"groups": rule["spec"]["groups"]}, open(sys.argv[2], "w"), sort_keys=False)
          PY
          docker run --rm --entrypoint promtool -v "$PWD/.github/prometheus:/r:ro" -w /r \
            prom/prometheus@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038 \
            check rules rules.yaml
          docker run --rm --entrypoint promtool -v "$PWD/.github/prometheus:/r:ro" -w /r \
            prom/prometheus@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038 \
            test rules alerts.test.yaml

      - name: helm template refuses anonymous auth on a TLS install
        run: |
          set -u
          base=(--set clusterDomain=nebari.example.com --set keycloak.url=https://keycloak.nebari.example.com/auth)
          if out=$(helm template test charts/nebari-apps "${base[@]}" --set api.auth.enabled=false 2>&1); then
            echo "::error::render succeeded with api.auth.enabled=false and tls.enabled=true"; exit 1
          fi
          echo "$out" | grep -q "insecureAllowAnonymous" || { echo "$out"; exit 1; }
          # The local-dev combination and the explicit override still render.
          helm template test charts/nebari-apps "${base[@]}" --set api.auth.enabled=false --set tls.enabled=false > /dev/null
          helm template test charts/nebari-apps "${base[@]}" --set api.auth.enabled=false --set api.auth.insecureAllowAnonymous=true > /dev/null

      - name: Validate the examples and the rendered chart (kubeconform)
        env:
          # datreeio/CRDs-catalog at a fixed commit, for third-party CRDs
          # (Argo CD's Application). NebariApp has no published schema.
          CRDS_CATALOG: https://raw.githubusercontent.com/datreeio/CRDs-catalog/501527ab9c40c827144c8f45945b25a023e344ce
        run: |
          curl -sSLo "$RUNNER_TEMP/kubeconform.tar.gz" \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C /usr/local/bin kubeconform
          # The App CRD, converted to the schema layout kubeconform looks up.
          pip install pyyaml==6.0.3
          schemas="$RUNNER_TEMP/schemas"
          python3 - "$schemas" <<'EOF'
          import json, os, sys, yaml
          crd = yaml.safe_load(open("charts/nebari-apps/crds/apps.nebari.dev_apps.yaml"))
          out = os.path.join(sys.argv[1], crd["spec"]["group"])
          os.makedirs(out, exist_ok=True)
          # The apiserver silently prunes fields the CRD does not declare, so a
          # typo in an example would vanish; reject unknown fields instead.
          def strict(node):
              if isinstance(node, dict):
                  if "properties" in node and "additionalProperties" not in node \
                          and not node.get("x-kubernetes-preserve-unknown-fields"):
                      node["additionalProperties"] = False
                  for child in node.values():
                      strict(child)
              elif isinstance(node, list):
                  for child in node:
                      strict(child)
          for v in crd["spec"]["versions"]:
              schema = v["schema"]["openAPIV3Schema"]
              strict(schema)
              name = f'{crd["spec"]["names"]["kind"].lower()}_{v["name"]}.json'
              json.dump(schema, open(os.path.join(out, name), "w"))
          EOF
          mkdir -p "$RUNNER_TEMP/rendered"
          base=(--set clusterDomain=nebari.example.com --set keycloak.url=https://keycloak.nebari.example.com/auth)
          helm template test charts/nebari-apps "${base[@]}" > "$RUNNER_TEMP/rendered/default.yaml"
          helm template test charts/nebari-apps -f examples/nebari-values.yaml > "$RUNNER_TEMP/rendered/nebari-values.yaml"
          helm template test charts/nebari-apps "${base[@]}" --set tls.enabled=false --set api.auth.enabled=false \
            > "$RUNNER_TEMP/rendered/local-dev.yaml"
          helm template test charts/nebari-apps "${base[@]}" --set telemetry.enabled=true \
            --set 'telemetry.metricsReaders[0].name=prometheus' --set 'telemetry.metricsReaders[0].namespace=monitoring' \
            > "$RUNNER_TEMP/rendered/telemetry.yaml"
          # Kubernetes types from the default catalog, App from the CRD, the
          # rest from the CRDs catalog; NebariApp is the only kind skipped.
          # Every manifest under examples/ (nebari-values.yaml is Helm values).
          manifests=()
          for f in examples/*.yaml; do
            [ "$f" = examples/nebari-values.yaml ] || manifests+=("$f")
          done
          kubeconform -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location "$schemas/{{ .Group }}/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json" \
            -schema-location "$CRDS_CATALOG/{{ .Group }}/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json" \
            "${manifests[@]}" "$RUNNER_TEMP"/rendered/*.yaml

  agent-docs:
    name: Agent docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Paths named in AGENTS.md and the skill exist
        run: python3 .github/scripts/check_doc_paths.py

  versions:
    name: Version strings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # release-please bumps all of these together; a hand edit to one of them
      # would ship mismatched versions.
      - name: Every version string matches .release-please-manifest.json
        run: |
          python3 - <<'PY'
          import json, re, sys
          want = json.load(open(".release-please-manifest.json"))["."]
          def grep(path, pattern):
              m = re.search(pattern, open(path).read(), re.M)
              return m.group(1) if m else None
          lock = json.load(open("ui/package-lock.json"))
          found = {
              "Chart.yaml version": grep("charts/nebari-apps/Chart.yaml", r"^version:\s*\"?([^\"\s#]+)"),
              "Chart.yaml appVersion": grep("charts/nebari-apps/Chart.yaml", r"^appVersion:\s*\"?([^\"\s#]+)"),
              "api __version__": grep("api/src/nebari_apps_api/__init__.py", r"^__version__ = \"([^\"]+)\""),
              "mcp __version__": grep("mcp/src/nebari_apps_mcp/__init__.py", r"^__version__ = \"([^\"]+)\""),
              "ui/package.json": json.load(open("ui/package.json"))["version"],
              "ui/package-lock.json": lock["version"],
              "ui/package-lock.json packages['']": lock["packages"][""]["version"],
          }
          bad = {k: v for k, v in found.items() if v != want}
          for k, v in found.items():
              print(("ok   " if v == want else "FAIL ") + f"{k}: {v}")
          if bad:
              print(f"::error::version strings must all be {want} (the release-please manifest)")
              sys.exit(1)
          PY

  pins:
    name: Runtime pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One version per runtime: the pin file CI reads must match the image
      # the Dockerfile builds from, and every base image is pinned by digest.
      - name: Pin files agree with the Dockerfiles
        run: |
          set -u
          fail=0
          check() { # <dockerfile> <image> <expected tag prefix>
            tags=$(sed -nE "s|^FROM (--platform=[^ ]+ )?$2:([^@ ]+).*|\2|p" "$1")
            [ -n "$tags" ] || { echo "::error file=$1::no FROM $2 line"; fail=1; return; }
            for t in $tags; do
              case "$t" in
                "$3"|"$3"-*) echo "ok   $1 $2:$t";;
                *) echo "::error file=$1::$2:$t does not match pin $3"; fail=1;;
              esac
            done
          }
          check ui/Dockerfile node "$(cat ui/.node-version)"
          check api/Dockerfile python "$(cat api/.python-version)"
          check mcp/Dockerfile python "$(cat mcp/.python-version)"
          check operator/Dockerfile golang "$(sed -nE 's/^toolchain go(.+)/\1/p' operator/go.mod)"
          if grep -nE '^FROM ' ui/Dockerfile api/Dockerfile mcp/Dockerfile operator/Dockerfile | grep -v '@sha256:'; then
            echo "::error::base images above are not pinned by digest"; fail=1
          fi
          exit "$fail"

  go:
    name: Operator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: operator/go.mod

      - name: go vet
        working-directory: operator
        run: go vet ./...

      - name: go build
        working-directory: operator
        run: go build ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: operator

      - name: Verify generated code is up to date
        working-directory: operator
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.21.0
          controller-gen object paths="./api/..."
          controller-gen crd paths="./api/..." output:crd:artifacts:config=../charts/nebari-apps/crds
          git diff --exit-code || (echo "::error::Generated code is stale; run controller-gen" && exit 1)

      # v1alpha1 only changes additively (App CRD reference, "Versioning and
      # deprecation"): compare the CRD with the base branch's.
      - name: CRD stays compatible with stored Apps
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          CRD: charts/nebari-apps/crds/apps.nebari.dev_apps.yaml
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if ! git show "FETCH_HEAD:$CRD" > "$RUNNER_TEMP/base-crd.yaml" 2>/dev/null; then
            echo "No CRD on $BASE_REF; nothing to compare."; exit 0
          fi
          pip install pyyaml==6.0.3
          python3 .github/scripts/check_crd_compat.py "$RUNNER_TEMP/base-crd.yaml" "$CRD"

  python:
    name: Python lint (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [api, mcp]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.11"
          enable-cache: true
          cache-dependency-glob: ${{ matrix.package }}/uv.lock

      - name: Install from the lockfile
        run: uv sync --frozen --extra dev

      - name: ruff check
        run: uv run --frozen --no-sync ruff check --output-format=github .

      - name: ruff format
        run: uv run --frozen --no-sync ruff format --check .

      - name: mypy (strict)
        run: uv run --frozen --no-sync mypy

  ui:
    name: UI lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      - name: Biome
        run: npm run check:ci
