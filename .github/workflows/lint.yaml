name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: helm lint
        run: helm lint charts/nebari-apps --set clusterDomain=nebari.example.com

      - name: helm template
        run: |
          helm template test charts/nebari-apps \
            --set clusterDomain=nebari.example.com \
            --set keycloak.url=https://keycloak.nebari.example.com/auth > /tmp/rendered.yaml
          echo "Rendered $(grep -c '^kind:' /tmp/rendered.yaml) resources"

      - name: helm template (examples/nebari-values.yaml)
        run: helm template test charts/nebari-apps -f examples/nebari-values.yaml > /dev/null

      - name: API RBAC is namespaced when allowedNamespaces is set
        run: |
          pip install pyyaml
          helm template test charts/nebari-apps \
            --set clusterDomain=nebari.example.com \
            --set keycloak.url=https://keycloak.nebari.example.com/auth \
            --set 'api.allowedNamespaces={apps,team-a}' > /tmp/scoped.yaml
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open("/tmp/scoped.yaml")) if d]
          crbs = [d for d in docs if d["kind"] == "ClusterRoleBinding" and d["roleRef"]["name"] == "test-nebari-apps-api"]
          assert not crbs, "API App/pod access must not be bound cluster-wide when allowedNamespaces is set"
          rbs = sorted(d["metadata"]["namespace"] for d in docs if d["kind"] == "RoleBinding" and d["roleRef"]["name"] == "test-nebari-apps-api")
          assert rbs == ["apps", "team-a"], rbs
          cluster = next(d for d in docs if d["kind"] == "ClusterRole" and d["metadata"]["name"] == "test-nebari-apps-api-cluster")
          assert {r["resources"][0] for r in cluster["rules"]} == {"namespaces", "pods"}, cluster["rules"]
          assert all(set(r["verbs"]) <= {"get", "list"} for r in cluster["rules"]), cluster["rules"]
          print("API RBAC scoped to", rbs)
          PY

      - name: helm template refuses anonymous auth on a TLS install
        run: |
          set -u
          base="--set clusterDomain=nebari.example.com --set keycloak.url=https://keycloak.nebari.example.com/auth"
          if out=$(helm template test charts/nebari-apps $base --set api.auth.enabled=false 2>&1); then
            echo "::error::render succeeded with api.auth.enabled=false and tls.enabled=true"; exit 1
          fi
          echo "$out" | grep -q "insecureAllowAnonymous" || { echo "$out"; exit 1; }
          # The local-dev combination and the explicit override still render.
          helm template test charts/nebari-apps $base --set api.auth.enabled=false --set tls.enabled=false > /dev/null
          helm template test charts/nebari-apps $base --set api.auth.enabled=false --set api.auth.insecureAllowAnonymous=true > /dev/null

      - name: Validate example App CRs against the CRD schema
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
          # Convert the CRD to a kubeconform-compatible JSON schema
          pip install pyyaml
          python3 - <<'EOF'
          import json, yaml
          crd = yaml.safe_load(open("charts/nebari-apps/crds/apps.nebari.dev_apps.yaml"))
          schema = crd["spec"]["versions"][0]["schema"]["openAPIV3Schema"]
          json.dump(schema, open("/tmp/app-schema.json", "w"))
          EOF
          # Only App resources are in these files, so a literal schema path works
          kubeconform -schema-location '/tmp/app-schema.json' \
            -summary examples/static-inline-app.yaml examples/static-git-app.yaml

  go:
    name: Operator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod

      - name: go vet
        working-directory: operator
        run: go vet ./...

      - name: go build
        working-directory: operator
        run: go build ./...

      - name: Verify generated code is up to date
        working-directory: operator
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.21.0
          controller-gen object paths="./api/..."
          controller-gen crd paths="./api/..." output:crd:artifacts:config=../charts/nebari-apps/crds
          git diff --exit-code || (echo "::error::Generated code is stale; run controller-gen" && exit 1)
