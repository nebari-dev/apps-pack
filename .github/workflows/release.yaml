name: Release

# Releasing is a chart version bump: merging a change to `version` in
# charts/nebari-apps/Chart.yaml releases it through the org's reusable
# workflow, which
#   - pins the five image tags to sha-<release commit> (images.yaml
#     builds those images on the same push),
#   - signs the packaged chart (keyless cosign, with provenance and SBOM) and
#     attaches it to a GitHub Release nebari-apps-<version>, and
#   - opens a PR in nebari-dev/helm-repository, which publishes the chart to
#     the org Helm repo once merged.
# The same packaged chart is mirrored to oci://ghcr.io/nebari-dev/apps-pack/charts.

on:
  push:
    branches: [main]
    paths:
      - "charts/nebari-apps/Chart.yaml"

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Same nebari-dev/.github commit as images.yaml: chart signing landed
    # after the v1 tag.
    uses: nebari-dev/.github/.github/workflows/pack-release.yaml@a6c757c72124a03542a79ac5385fd250ee9c45b7
    with:
      chart-path: charts/nebari-apps
      chart-name: nebari-apps
      tag-paths: |
        operator.image.tag
        authz.image.tag
        api.image.tag
        ui.image.tag
        mcp.image.tag
    secrets:
      NEBARI_HELM_REPO_TOKEN: ${{ secrets.NEBARI_HELM_REPO_TOKEN }}

  mirror-oci:
    name: Mirror chart to GHCR
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Download the released chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -E '^version:' charts/nebari-apps/Chart.yaml | awk '{print $2}' | tr -d "\"'")
          gh release download "nebari-apps-${version}" --pattern '*.tgz' --dir dist

      - name: Push to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push dist/*.tgz "oci://ghcr.io/${REPO}/charts"
