name: Release PR

# Keeps one open "chore: release X.Y.Z" pull request that bumps every version
# string (Chart.yaml version and appVersion, the api and mcp __version__,
# ui/package.json and its lockfile) and prepends the release's CHANGELOG.md
# section, built from the conventional-commit titles merged since the last
# release. Merging it is the release: the Chart.yaml bump runs release.yaml.
#
# release-please never creates the tag or GitHub Release itself
# (skip-github-release): pack-release does, as nebari-apps-<version>, and the
# tag format below matches it so release-please finds the previous release.
# Labels are skipped too, so a merged release PR is never left "pending".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PR opened with the default GITHUB_TOKEN does not trigger CI; set
          # RELEASE_PLEASE_TOKEN (a bot token with contents + pull-requests
          # write) so the release PR runs its checks without a manual reopen.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
          skip-labeling: true
