name: Images

# check: builds each of the five images once on amd64, scans it with Trivy and,
# for apps-ui, boots it to assert the security headers. Runs on pull requests,
# on main, and weekly.
#
# publish (main and manual runs only): builds the images for amd64 and arm64
# through the org's reusable workflow, which pushes them to GHCR
# (ghcr.io/nebari-dev/apps-pack/<image>) and quay.io/nebari, then signs them
# keyless with cosign and attests build provenance and an SBOM. Pushes are
# tagged sha-<short> and `latest`; `latest` tracks main and is for development
# only (released charts pin sha tags).
#
# Chart.yaml is in the push paths on purpose: release.yaml pins the chart to
# the release commit's sha, so that version-bump commit must produce images.

on:
  push:
    branches: [main]
    paths:
      - "operator/**"
      - "authz/**"
      - "api/**"
      - "ui/**"
      - "mcp/**"
      - "charts/nebari-apps/Chart.yaml"
      - ".github/workflows/images.yaml"
  pull_request:
    paths:
      - "operator/**"
      - "authz/**"
      - "api/**"
      - "ui/**"
      - "mcp/**"
      - ".github/workflows/images.yaml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR runs; every push to main still runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On the weekly schedule this rebuilds from the digest-pinned bases, so
  # advisories published since the last merge surface against exactly what
  # ships.
  check:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: apps-operator
            context: operator
          - image: apps-authz
            context: authz
          - image: apps-api
            context: api
          - image: apps-ui
            context: ui
          - image: apps-mcp
            context: mcp
    env:
      IMAGE: ${{ matrix.image }}
      CONTEXT: ${{ matrix.context }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build --pull -t "$IMAGE:ci" "$CONTEXT"

      # Fails on any HIGH or CRITICAL vulnerability that has a fix available, in
      # the OS packages or the application's dependencies.
      - name: Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:ci"

      # Boots the real image so the assertion covers nginx's header
      # inheritance, not just the config text.
      - name: Security headers
        if: matrix.image == 'apps-ui'
        run: ui/scripts/check-headers.sh apps-ui:ci

  # Not `needs: check`: a newly published CVE must not stop `latest` tracking
  # main, or the release commit's sha images from existing (release.yaml
  # depends on them).
  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: apps-operator
            context: operator
          - image: apps-authz
            context: authz
          - image: apps-api
            context: api
          - image: apps-ui
            context: ui
          - image: apps-mcp
            context: mcp
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # Pinned to nebari-dev/.github main (2026-07-30): signing and attestations
    # landed after the v1 tag. Move to the next tag once one includes them.
    uses: nebari-dev/.github/.github/workflows/pack-build-image.yaml@a6c757c72124a03542a79ac5385fd250ee9c45b7
    with:
      image: ${{ matrix.image }}
      context: ${{ matrix.context }}
      platforms: linux/amd64,linux/arm64
      push: true
    secrets:
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
