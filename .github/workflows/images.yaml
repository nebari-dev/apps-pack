name: Images

# check: builds each of the five images once on amd64 and, for apps-ui, boots
# it to assert the security headers. Runs on pull requests,
# and on main.
#
# publish (main and manual runs only): builds the images for amd64 and arm64
# through the org's reusable workflow, which pushes them to GHCR
# (ghcr.io/nebari-dev/apps-pack/<image>) and quay.io/nebari, then signs them
# keyless with cosign and attests build provenance and an SBOM. Pushes are
# tagged sha-<short> and `latest`; `latest` tracks main and is for development
# only (released charts pin sha tags).
#
# Chart.yaml is in the push paths on purpose: release.yaml pins the chart to
# the release commit's sha, so that version-bump commit must produce images.

on:
  push:
    branches: [main]
    paths:
      - "operator/**"
      - "proxy/**"
      - "api/**"
      - "ui/**"
      - "mcp/**"
      - "charts/nebari-apps/Chart.yaml"
      - ".github/workflows/images.yaml"
  pull_request:
    paths:
      - "operator/**"
      - "proxy/**"
      - "api/**"
      - "ui/**"
      - "mcp/**"
      - ".github/workflows/images.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR runs; every push to main still runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: operator
            context: operator
          - image: proxy
            context: proxy
          - image: api
            context: api
          - image: ui
            context: ui
          - image: mcp
            context: mcp
    env:
      IMAGE: ${{ matrix.image }}
      CONTEXT: ${{ matrix.context }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build --pull -t "$IMAGE:ci" "$CONTEXT"

      # Boots the real image so the assertion covers nginx's header
      # inheritance, not just the config text.
      - name: Security headers
        if: matrix.image == 'ui'
        run: ui/scripts/check-headers.sh ui:ci

  # Not `needs: check`: a failing check must not stop `latest` tracking main,
  # or the release commit's sha images from existing (release.yaml depends on
  # them).
  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: operator
            context: operator
          - image: proxy
            context: proxy
          - image: api
            context: api
          - image: ui
            context: ui
          - image: mcp
            context: mcp
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # Pinned to nebari-dev/.github main (2026-07-30): signing and attestations
    # landed after the v1 tag. Move to the next tag once one includes them.
    uses: nebari-dev/.github/.github/workflows/pack-build-image.yaml@a6c757c72124a03542a79ac5385fd250ee9c45b7
    with:
      image: ${{ matrix.image }}
      context: ${{ matrix.context }}
      platforms: linux/amd64,linux/arm64
      push: true
    secrets:
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
