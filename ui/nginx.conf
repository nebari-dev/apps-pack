pid /tmp/nginx/nginx.pid;

events {}

http {
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    # Locations that set their own headers (caching, config.json) keep the
    # server-level security headers below instead of replacing them.
    add_header_inherit merge;
    client_max_body_size 2m;

    # One id per request, shared with apps-api and apps-mcp logs: the caller's
    # X-Request-ID if it sent one, otherwise nginx's own.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    server {
        listen       8080;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        # Security headers, on every response including errors and proxied
        # /api and /mcp ones.
        #
        # CSP: scripts are the bundle plus the pre-paint theme bootstrap inlined
        # in index.html, allowed by hash (tests/lib/csp.test.ts fails when the
        # script changes and this hash does not). Inline styles stay allowed
        # for style attributes (Base UI positioning, bar widths). connect-src
        # adds the Keycloak origin keycloak-js exchanges tokens with; images
        # may come from anywhere (branding logos, app thumbnails).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-lk2rn/9UKl1bIdTLOpKw4/jM8Af6z6UJB5L58x/nI3A='; style-src 'self' 'unsafe-inline'; img-src * data: blob:; font-src 'self' data:; connect-src 'self' ${KEYCLOAK_ORIGIN}; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # Empty (no header) unless the chart serves the UI over TLS.
        add_header Strict-Transport-Security "${HSTS}" always;

        location = /healthz {
            access_log off;
            return 200 "ok";
        }

        gzip on;
        gzip_types text/plain text/css application/json application/javascript
                text/xml application/xml application/xml+rss text/javascript
                image/svg+xml;
        gzip_min_length 1024;
        gzip_vary on;

        # Proxy API requests to apps-api; avoids CORS and keeps paths relative.
        location /api/ {
            proxy_pass ${API_URL}/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
        }

        # Proxy the MCP endpoint to apps-mcp (streamable HTTP: SSE-friendly
        # settings - no buffering, long read timeout).
        location /mcp {
            proxy_pass ${MCP_URL}/mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding on;
            proxy_hide_header X-Accel-Buffering;
            add_header X-Accel-Buffering no;
        }

        # MCP OAuth protected resource metadata (RFC 9728) for /mcp, served by
        # apps-mcp: MCP clients read it to find the Keycloak realm to sign in with.
        location /.well-known/oauth-protected-resource {
            proxy_pass ${MCP_URL};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header Connection "";
        }

        # Serve pre-built assets directly; fall back to index.html for SPA routes.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Vite's output: every file name carries a content hash, so it can be
        # cached forever. Files from public/ (favicon.svg, logos) keep their
        # names across releases and get nginx's default revalidation instead.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-store";
        }

        # Runtime branding config (rendered by the Helm chart, mounted over the
        # placeholder baked into the image). Never cached, so a branding change
        # takes effect on the next page load instead of being pinned to a stale
        # copy. Exact-match locations win over the /assets/ prefix regardless
        # of order.
        location = /config.json {
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }
    }
}
