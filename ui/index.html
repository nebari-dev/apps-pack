<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Pre-paint theme bootstrap: applies the saved (or OS) theme before first
      paint so there is no flash of the wrong theme. Generated by
      themeBootstrapScript('nebari-apps:themeMode') from
      @nebari/use-theme-preference (src/hooks/use-theme-preference.ts); keep
      the storage key in sync with the ThemeProvider in src/main.tsx.
    -->
    <script>
      (function () {
        var mode = null;
        var prefersDark = false;
        try {
          mode = localStorage.getItem("nebari-apps:themeMode");
        } catch (e) {}
        try {
          prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {}
        var isDark = mode === 'dark' || (mode !== 'light' && prefersDark);
        try {
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nebari Apps</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
