# Launch manifest for the Nebari Apps Pack (Python/pixi app).
# Say "launch it" to a coding agent connected to the nebari-apps MCP server.
name: web-terminal
namespace: apps
displayName: "Web Terminal"
description: "A bash shell in the app pod, served in the browser by ttyd"
source:
  type: files
  files:
    path: .            # directory containing pixi.toml, relative to this file
runtime:
  pixiTask: start      # pixi task that starts the server on 0.0.0.0:8080
  resources:           # a shell can run anything; cap it. Limits leave headroom
    requests: { cpu: 250m, memory: 512Mi }   # for the cold-start `pixi install`.
    limits: { cpu: "2", memory: 2Gi }
access:
  public: false        # a shell: keep it behind Keycloak SSO at the gateway
  # Intended audience. NOTE: as of nebari-operator 0.1.0 this only controls
  # landing-page tile visibility — the gateway SecurityPolicy has no group
  # authorization rule, so ANY signed-in realm user who knows the URL can open
  # the shell. Treat `public: false` as "authenticated", not "authorized".
  groups: ["admin"]
  subdomain: web-terminal
