# A private Python app that reads a credential from its environment without
# the App ever holding it. runtime.secretKeys lists names only; the values live
# in the Secret app-<name>-secrets in the same namespace, which the operator
# injects into the app container as environment variables.
#
# Through the UI, the API or the MCP server you never create that Secret
# yourself: set the value in the launch or edit form's Secrets section (or
# `secrets` in the request), and apps-api writes it, owned by the App, and rolls
# the pods. With kubectl, create it before or after applying this file:
#
#   read -rs API_TOKEN   # typed, not echoed or kept in shell history
#   kubectl -n apps create secret generic app-hello-secret-secrets \
#     --from-literal=API_TOKEN="$API_TOKEN"
#
# Until the Secret holds every listed key the container waits in
# CreateContainerConfigError. After changing it with kubectl, run
#   kubectl -n apps rollout restart deployment/app-hello-secret
apiVersion: apps.nebari.dev/v1alpha1
kind: App
metadata:
  name: hello-secret
spec:
  displayName: "Hello Secret"
  description: "Reads API_TOKEN from a Secret, never from the App"
  runtime:
    pixiTask: start
    secretKeys: [API_TOKEN]
  source:
    type: inline
    inline:
      files:
        pixi.toml: |
          [project]
          name = "hello-secret"
          channels = ["conda-forge"]
          platforms = ["linux-64", "linux-aarch64"]

          [dependencies]
          python = "3.12.*"

          [tasks]
          start = "python server.py"
        server.py: |
          import os
          from http.server import BaseHTTPRequestHandler, HTTPServer

          # Use the credential; never echo it back.
          TOKEN = os.environ.get("API_TOKEN", "")

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header("Content-Type", "text/plain")
                  self.end_headers()
                  state = f"set ({len(TOKEN)} characters)" if TOKEN else "not set"
                  self.wfile.write(f"API_TOKEN is {state}\n".encode())

          port = int(os.environ.get("PORT", "8080"))
          HTTPServer(("0.0.0.0", port), Handler).serve_forever()
  access:
    public: false
    subdomain: hello-secret
