[workspace]
name = "python-app"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[dependencies]
python = "3.12.*"
streamlit = ">=1.44"

[tasks]
# The platform runs `pixi run start` and expects a server on 0.0.0.0:$PORT
# (8080, or 8081 when access.groups/users is set). Locally: PORT=8080 pixi run start
start = "streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true"
