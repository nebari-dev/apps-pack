# An app that runs a prebuilt container image instead of serving or building
# content (source.type: image). Image apps are off until the platform team
# allows a registry in the chart:
#
#   apps:
#     image:
#       allowedRegistries: [docker.io/library]   # Docker Hub official images
#
# The reference needs a tag or a digest (pin a digest, @sha256:..., for
# reproducible deployments). Docker Hub short names are expanded, so
# python:3.12-slim is docker.io/library/python:3.12-slim.
#
# The official python image runs as root by default, which app pods never do,
# so runAsUser picks a non-root uid; an image built with a numeric non-root
# USER needs no runAsUser. The server listens on source.image.port (also passed
# as $PORT); the pack's sidecar sits in front of it on 8080, so the image may
# not use 8080 or 8082. command/args replace the image's ENTRYPOINT/CMD, exec
# form, no shell. A real app would ship its own server in its image (Streamlit,
# Gradio, Shiny, Dash, a Node service) and need only reference and port.
apiVersion: apps.nebari.dev/v1alpha1
kind: App
metadata:
  name: hello-image
spec:
  displayName: "Hello Image"
  description: "A prebuilt container image run as a non-root user"
  source:
    type: image
    image:
      reference: python:3.12-slim
      port: 8000
      runAsUser: 65532
      command: ["python", "-c"]
      args:
        - |
          import os
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header("Content-Type", "text/plain")
                  self.end_headers()
                  self.wfile.write(f"Hello from an image, running as uid {os.getuid()}\n".encode())

          HTTPServer(("0.0.0.0", int(os.environ["PORT"])), Handler).serve_forever()
  runtime:
    resources:
      limits: { cpu: 250m, memory: 128Mi }
  access:
    public: false
    subdomain: hello-image
