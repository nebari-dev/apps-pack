{{- if .Values.api.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nebari-apps.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nebari-apps.labels" . | nindent 4 }}
---
# Cluster-scoped reads only: which namespaces are launchable, and pod usage
# from metrics.k8s.io (read-only numbers).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nebari-apps.fullname" . }}-api-cluster
  labels:
    {{- include "nebari-apps.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nebari-apps.fullname" . }}-api-cluster
  labels:
    {{- include "nebari-apps.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "nebari-apps.fullname" . }}-api-cluster
subjects:
  - kind: ServiceAccount
    name: {{ include "nebari-apps.fullname" . }}-api
    namespace: {{ .Release.Namespace }}
---
# What the API may do inside an app namespace: write App CRs, write their
# Secrets, and read their children for observability. Bound per namespace in api.allowedNamespaces
# (RoleBindings); cluster-wide only when that list is empty, because then
# app namespaces are discovered by label.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nebari-apps.fullname" . }}-api
  labels:
    {{- include "nebari-apps.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps.nebari.dev"]
    resources: ["apps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Roll app pods on demand (POST /apps/{ns}/{name}/restart).
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  # Write each App's secret values to its Secret (app-<name>-secrets, owned
  # by the App) from launch, edit and PATCH /apps/{ns}/{name}/secrets.
  # No get, list or watch: the API never reads or enumerates Secrets (a write
  # response carries the object; the API drops it), and it only ever names
  # the Secret of an App the caller may manage. Scope it with
  # api.allowedNamespaces; with that list empty this binding is cluster-wide.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch"]
{{- $root := . }}
{{- range .Values.api.allowedNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "nebari-apps.fullname" $root }}-api
  namespace: {{ . }}
  labels:
    {{- include "nebari-apps.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "nebari-apps.fullname" $root }}-api
subjects:
  - kind: ServiceAccount
    name: {{ include "nebari-apps.fullname" $root }}-api
    namespace: {{ $root.Release.Namespace }}
{{- else }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nebari-apps.fullname" . }}-api
  labels:
    {{- include "nebari-apps.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "nebari-apps.fullname" . }}-api
subjects:
  - kind: ServiceAccount
    name: {{ include "nebari-apps.fullname" . }}-api
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nebari-apps.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nebari-apps.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "nebari-apps.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "nebari-apps.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "nebari-apps.fullname" . }}-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          env:
            - name: APPS_DOMAIN
              value: {{ include "nebari-apps.appsDomain" . }}
            - name: IDLE_TIMEOUT_MINUTES
              value: {{ .Values.apps.idle.timeoutMinutes | quote }}
            # Checked again by the operator; here so a request outside the
            # allowlist fails with a clear 422.
            - name: IMAGE_REGISTRIES
              value: {{ join "," .Values.apps.image.allowedRegistries | quote }}
            {{- with .Values.api.allowedNamespaces }}
            - name: APPS_NAMESPACES
              value: {{ join "," . | quote }}
            {{- end }}
            - name: APPS_ADMIN_GROUPS
              value: {{ join "," .Values.api.adminGroups | quote }}
            - name: TLS_DISABLED
              value: {{ not .Values.tls.enabled | quote }}
            - name: APPS_BUILD
              value: {{ .Values.api.image.tag | default .Chart.AppVersion | quote }}
            {{- include "nebari-apps.oidcEnv" (dict "root" . "spaVar" "UI_KEYCLOAK_CLIENT_ID") | nindent 12 }}
            {{- if .Values.api.auth.enabled }}
            # Served to the UI by GET /api/v1/config for keycloak-js.
            - name: UI_KEYCLOAK_URL
              value: {{ .Values.keycloak.url }}
            - name: UI_KEYCLOAK_REALM
              value: {{ .Values.keycloak.realm }}
            {{- if and .Values.mcp.enabled .Values.mcp.oauth.clientId }}
            # Served to the UI for its `claude mcp add` command.
            - name: MCP_OAUTH_CLIENT_ID
              value: {{ .Values.mcp.oauth.clientId | quote }}
            - name: MCP_OAUTH_CALLBACK_PORT
              value: {{ .Values.mcp.oauth.callbackPort | quote }}
            {{- end }}
            {{- end }}
            {{- /* Last, so an extraEnv entry overrides a chart variable of the same name. */}}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          # Ready only while the Kubernetes API answers and (with auth) the
          # realm JWKS loads; each check gives up after 3s.
          readinessProbe:
            httpGet:
              path: /api/v1/readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 8
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            # The only writable path: Python's tempfile and any library cache.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nebari-apps.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nebari-apps.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "nebari-apps.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
{{- end }}
