apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nebari-apps.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nebari-apps.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      {{- include "nebari-apps.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        {{- include "nebari-apps.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: {{ include "nebari-apps.fullname" . }}-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: {{ include "nebari-apps.operatorImage" . }}
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          args:
            - --apps-domain={{ include "nebari-apps.appsDomain" . }}
            - --gateway={{ .Values.gateway }}
            - --static-image={{ .Values.staticImage }}
            - --git-image={{ .Values.gitImage }}
            - --python-image={{ .Values.pythonImage }}
            - --proxy-image={{ include "nebari-apps.proxyImage" . }}
            - --proxy-image-pull-policy={{ .Values.proxy.image.pullPolicy }}
            - {{ printf "--proxy-resources=%s" (toJson .Values.proxy.resources) | quote }}
            - {{ printf "--default-static-resources=%s" (toJson .Values.apps.defaultResources.static) | quote }}
            - {{ printf "--default-python-resources=%s" (toJson .Values.apps.defaultResources.python) | quote }}
            {{- if not .Values.tls.enabled }}
            - --tls-disabled
            {{- end }}
            {{- if .Values.apps.landingPage.enabled }}
            - --landing-page
            {{- end }}
            - --idle-timeout-minutes={{ .Values.apps.idle.timeoutMinutes }}
            - {{ printf "--image-registries=%s" (join "," .Values.apps.image.allowedRegistries) | quote }}
            - {{ printf "--image-pull-secrets=%s" (join "," .Values.apps.image.pullSecrets) | quote }}
            - --activator-service={{ include "nebari-apps.fullname" . }}-activator
            - --activator-namespace={{ .Release.Namespace }}
            {{- if .Values.operator.leaderElection }}
            - --leader-elect
            {{- end }}
          {{- with .Values.operator.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: probes
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 8443
              protocol: TCP
            # The page idle Apps serve while they start (the activator Service).
            - name: activator
              containerPort: 8090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
---
# Idle Apps' NebariApps route here (a cross-namespace backendRef the
# operator allows with a ReferenceGrant of the same name). Every operator
# replica answers, leader or not.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nebari-apps.fullname" . }}-activator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nebari-apps.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  type: ClusterIP
  selector:
    {{- include "nebari-apps.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: operator
  ports:
    - name: http
      port: 8080
      targetPort: activator
      protocol: TCP
