[project]
name = "APP_NAME"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[dependencies]
python = "3.12.*"
fastapi = "*"
uvicorn = "*"

[tasks]
# The platform injects PORT (8080, or 8081 when access.groups is set or the app can idle)
# and expects the task to serve on 0.0.0.0:$PORT. Locally: PORT=8080 pixi run start
start = "uvicorn app:app --host 0.0.0.0 --port $PORT"
