[project]
name = "nebari-apps-mcp"
version = "0.1.0"
description = "MCP server for the Nebari Apps Pack - launch and manage web apps from coding agents"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.10",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<2.5",
    # The tests run the MCP tools against the real apps-api in-process.
    "fastapi>=0.115",
    "python-multipart>=0.0.12",
    "PyJWT[crypto]>=2.15",
    "kubernetes>=31.0",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nebari_apps_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
pydocstyle = { convention = "google" }
select = ["E", "F", "I001", "B", "C4", "ISC", "RET", "SIM", "PTH", "D2", "UP", "ASYNC", "RUF"]
ignore = [
    # Conflicts with the ruff formatter
    "ISC001",
    # Only strings can exceed the line length once the formatter has run
    "E501",
    # Docstrings wrap their opening sentence; in apps-mcp they are the tool
    # descriptions agents read, so they are not split into summary + body.
    "D205",
    # Mutually exclusive with D211 / D212
    "D203",
    "D213",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
