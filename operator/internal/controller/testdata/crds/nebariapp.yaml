# Stand-in for nebari-operator's NebariApp CRD in the envtest suite: same
# group/version/kind and a status subresource, schema left open (the pack
# writes it unstructured; the nebari-operator contract is pinned elsewhere).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nebariapps.reconcilers.nebari.dev
spec:
  group: reconcilers.nebari.dev
  scope: Namespaced
  names:
    kind: NebariApp
    listKind: NebariAppList
    plural: nebariapps
    singular: nebariapp
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
